---
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart redis
  ansible.builtin.systemd:
    name: redis-server
    state: restarted

- name: Restart Nautobot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - nautobot-server
    - nautobot-worker
    - nautobot-scheduler
  when: server_manage_app | bool
