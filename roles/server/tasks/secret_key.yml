---
# Controller-delegated tasks set ansible_become as a variable: an inventory-level ansible_become
# overrides the become keyword.
- name: Read the existing OpenBao secret before resolving the SECRET_KEY
  ansible.builtin.uri:
    url: >-
      {{ server_openbao_addr | regex_replace('/+$', '') }}/v1/{{ server_openbao_mount
      }}/data/{{ server_secret_key_path }}
    method: GET
    headers:
      X-Vault-Token: "{{ server_openbao_token }}"
    status_code: [200, 404]
    validate_certs: true
    ca_path: "{{ server_openbao_ca_file }}"
  register: server_secret_key_secret_read
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  check_mode: false
  when: server_manage_app | bool

- name: Initialize SECRET_KEY store defaults
  ansible.builtin.set_fact:
    server_secret_key_stored_value: ""
    server_secret_key_secret_version: 0
    server_secret_key_secret_data: {}
  no_log: true
  when: server_manage_app | bool

- name: Save the stored SECRET_KEY and sibling fields in memory
  ansible.builtin.set_fact:
    server_secret_key_stored_value: >-
      {{ server_secret_key_secret_read.json.data.data[server_secret_key_field]
      | default('') | string }}
    server_secret_key_secret_version: "{{ server_secret_key_secret_read.json.data.metadata.version | int }}"
    server_secret_key_secret_data: "{{ server_secret_key_secret_read.json.data.data }}"
  no_log: true
  when:
    - server_manage_app | bool
    - server_secret_key_secret_read.status | int == 200

- name: Check for a previously persisted SECRET_KEY
  ansible.builtin.stat:
    path: "{{ server_secret_key_file }}"
  register: server_secret_key_stat

- name: Read the persisted SECRET_KEY file when present
  ansible.builtin.slurp:
    src: "{{ server_secret_key_file }}"
  register: server_secret_key_file_slurp
  no_log: true
  when: server_secret_key_stat.stat.exists

- name: Set the effective SECRET_KEY using caller, store, file and generated precedence
  ansible.builtin.set_fact:
    server_effective_secret_key: >-
      {{ server_secret_key
      if server_secret_key | length > 0
      else server_secret_key_stored_value
      if server_secret_key_stored_value | default('', true) | length > 0
      else server_secret_key_file_slurp.content | b64decode
      if server_secret_key_stat.stat.exists
      else lookup('ansible.builtin.password', '/dev/null length=64') }}
  no_log: true

- name: Persist the effective SECRET_KEY when the host file differs
  ansible.builtin.copy:
    content: "{{ server_effective_secret_key }}"
    dest: "{{ server_secret_key_file }}"
    owner: "{{ server_user }}"
    group: "{{ server_group }}"
    mode: "0600"
  register: server_secret_key_file_write
  no_log: true
  when: >-
    not server_secret_key_stat.stat.exists
    or (server_secret_key_file_slurp.content | b64decode) != server_effective_secret_key

- name: Add the effective SECRET_KEY to Nautobot's task environment
  ansible.builtin.set_fact:
    server_env: "{{ server_env | combine({'NAUTOBOT_SECRET_KEY': server_effective_secret_key}) }}"
  no_log: true

- name: Publish a changed SECRET_KEY while preserving sibling secret fields
  ansible.builtin.uri:
    url: >-
      {{ server_openbao_addr | regex_replace('/+$', '') }}/v1/{{ server_openbao_mount
      }}/data/{{ server_secret_key_path }}
    method: POST
    headers:
      X-Vault-Token: "{{ server_openbao_token }}"
    body_format: json
    body:
      options:
        cas: "{{ server_secret_key_secret_version | int }}"
      data: >-
        {{ server_secret_key_secret_data
        | combine({server_secret_key_field: server_effective_secret_key}) }}
    status_code: [200, 204]
    validate_certs: true
    ca_path: "{{ server_openbao_ca_file }}"
  register: server_secret_key_publish_result
  changed_when: true
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  when:
    - server_manage_app | bool
    - server_secret_key_stored_value | default('', true) != server_effective_secret_key
