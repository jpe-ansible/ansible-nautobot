---
- name: Remove stale owned virtual machine interfaces
  networktocode.nautobot.vm_interface:
    url: "{{ sync_in_nautobot_url }}"
    token: "{{ sync_in_write_token }}"
    id: "{{ item.id }}"
    state: absent
  loop: "{{ sync_in_pve_prune_lists.vm_interfaces }}"
  loop_control:
    label: interface
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Remove stale owned IP addresses
  networktocode.nautobot.ip_address:
    url: "{{ sync_in_nautobot_url }}"
    token: "{{ sync_in_write_token }}"
    id: "{{ item.id }}"
    state: absent
  loop: "{{ sync_in_pve_prune_lists.ip_addresses }}"
  loop_control:
    label: address
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Remove stale owned virtual machines
  networktocode.nautobot.virtual_machine:
