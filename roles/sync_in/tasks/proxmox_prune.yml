  loop: "{{ sync_in_pve_prune_lists.virtual_machines }}"
  loop_control:
    label: virtual machine
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Remove stale owned drive inventory items
  networktocode.nautobot.inventory_item:
