  no_log: true

- name: Remove stale owned node devices
  networktocode.nautobot.device:
    url: "{{ sync_in_nautobot_url }}"
    token: "{{ sync_in_write_token }}"
    id: "{{ item.id }}"
    state: absent
  loop: "{{ sync_in_pve_prune_lists.devices }}"
  loop_control:
    label: device
  delegate_to: localhost
