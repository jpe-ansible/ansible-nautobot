---
- name: Probe write access on a model for the reader accounts
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/dcim/devices/"
    method: POST
    headers:
      Authorization: "Token {{ item.value.token }}"
      Accept: application/json
    body_format: json
    body: {}
    status_code: [200, 201, 400, 403]
    return_content: true
  loop: >-
    {{ live_service_account_values | dict2items
       | rejectattr('key', 'equalto', 'writer') | list }}
  loop_control:
    label: "{{ item.key }}"
  register: live_reader_write_probes
  no_log: true

- name: Record reader write access failures
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures + (
        ['Reader account ' ~ item.item.key ~ ' did not receive HTTP 403 on a model POST (HTTP '
        ~ (item.status | default(0) | string) ~ ').']
        if item.status | default(0) | int != 403 else []) }}
  loop: "{{ live_reader_write_probes.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Query virtual machines with the inventory token
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/graphql/"
    method: POST
    headers:
      Authorization: "Token {{ live_service_account_values.inventory.token }}"
      Content-Type: application/json
    body_format: json
    body:
      query: "query { virtual_machines { id } }"
    status_code: 200
    return_content: true
  register: live_inventory_virtual_machine_query
  no_log: true

- name: Confirm virtual machines exist for the inventory visibility control
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/graphql/"
    method: POST
    headers:
      Authorization: "Token {{ live_test_token }}"
      Content-Type: application/json
    body_format: json
    body:
      query: "query { virtual_machines { id } }"
    status_code: 200
    return_content: true
  register: live_superuser_virtual_machine_query
  no_log: true

- name: Record inventory GraphQL visibility failures
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures + (
        ['Inventory reader exposed VirtualMachines outside its object type list.']
        if live_inventory_virtual_machine_query.json.data.virtual_machines | default([]) | length > 0 else [])
        + (
          ['The superuser visibility control found no VirtualMachines.']
          if live_superuser_virtual_machine_query.json.data.virtual_machines | default([]) | length == 0
          else []) }}
