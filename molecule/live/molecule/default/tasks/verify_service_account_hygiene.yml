---
- name: Capture token counts before an unchanged account run
  ansible.builtin.include_tasks: collect_live_service_token_counts.yml

- name: Save account token counts and secret versions before an unchanged run
  ansible.builtin.set_fact:
    live_service_token_counts_before_noop: "{{ live_service_token_counts }}"
    live_service_secret_versions_before_noop: >-
      {%- set versions = namespace(by_account={}) -%}
      {%- for item in live_service_account_values | dict2items -%}
      {%- set _ = versions.by_account.update({item.key: item.value.version}) -%}
      {%- endfor -%}
      {{ versions.by_account }}
  no_log: true

- name: Run service account reconciliation without extra tokens
  ansible.builtin.include_tasks: run_server_accounts.yml

- name: Record an unexpected changed result for an unchanged account run
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures + (
        ['Service account reconciliation reported changes when no extra token existed.']
        if server_service_token_sweep_changed | default(false) | bool else []) }}
  no_log: true

- name: Reload published account secrets after the unchanged run
  ansible.builtin.include_tasks: load_live_service_secrets.yml

- name: Capture token counts after the unchanged account run
  ansible.builtin.include_tasks: collect_live_service_token_counts.yml

- name: Record unexpected token or secret changes during the unchanged run
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures
        + (
          ['Service account tokens changed during an unchanged account run.']
          if live_service_token_counts != live_service_token_counts_before_noop else [])
        + (
          ['OpenBao secret versions changed during an unchanged account run.']
          if (
            live_service_account_values | dict2items
            | map(attribute='value.version') | list
          ) != (
            live_service_account_secret_version_values_before_noop | default([])
          ) else []) }}
  vars:
    live_service_account_secret_version_values_before_noop: >-
      {{ live_service_secret_versions_before_noop | dict2items
         | sort(attribute='key') | map(attribute='value') | list }}
  no_log: true

- name: Mint an additional token with the managed MCP reader token
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/users/tokens/"
    method: POST
    headers:
      Authorization: "Token {{ live_service_account_values.mcp.token }}"
      Accept: application/json
    body_format: json
    body:
      description: live-sweep-extra
      write_enabled: false
    status_code: [201, 400, 403]
    return_content: true
  register: live_extra_token_create
  no_log: true

- name: Record failure to mint the extra token through its service account
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures + (
        ['MCP reader could not mint an additional own token (HTTP '
        ~ (live_extra_token_create.status | default(0) | string) ~ ').']
        if live_extra_token_create.status | default(0) | int != 201 else [])
        + (
          ['The additional service token had an expiry.']
          if live_extra_token_create.status | default(0) | int == 201 and
             live_extra_token_create.json.expires | default(none) is not none else []) }}
  no_log: true

- name: Capture service token counts after minting the extra token
  ansible.builtin.include_tasks: collect_live_service_token_counts.yml
  when: live_extra_token_create.status | default(0) | int == 201

- name: Record whether the extra token increased the MCP token count
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures + (
        ['The extra MCP token was not visible in the account token list.']
        if live_extra_token_create.status | default(0) | int == 201 and
           live_service_token_counts.mcp | default(0) | int
           != live_service_token_counts_before_noop.mcp | default(0) | int + 1 else []) }}
  when: live_extra_token_create.status | default(0) | int == 201
  no_log: true

- name: Run account reconciliation to remove the extra token
  ansible.builtin.include_tasks: run_server_accounts.yml
  when: live_extra_token_create.status | default(0) | int == 201

- name: Record whether token hygiene changed Nautobot
  ansible.builtin.set_fact:
    live_service_accounts_changed_with_extra_token: "{{ server_service_token_sweep_changed | default(false) | bool }}"
  when: live_extra_token_create.status | default(0) | int == 201
  no_log: true

- name: Reload published account secrets after token hygiene
  ansible.builtin.include_tasks: load_live_service_secrets.yml

- name: Capture token counts after token hygiene
  ansible.builtin.include_tasks: collect_live_service_token_counts.yml

- name: Record token hygiene failures
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures
        + (
          ['Service account reconciliation reported no change while an extra token existed.']
          if live_extra_token_create.status | default(0) | int == 201 and
             not live_service_accounts_changed_with_extra_token | default(false) | bool else [])
        + (
          ['The extra MCP token survived service account reconciliation.']
          if live_extra_token_create.status | default(0) | int == 201 and (
            live_service_token_lists.results
            | selectattr('item.key', 'equalto', 'mcp') | first
          ).json.results | selectattr('id', 'equalto', live_extra_token_create.json.id) | list | length > 0
          else [])
        + (
          ['The published MCP token stopped working after token hygiene.']
          if (
            live_service_token_lists.results
            | selectattr('item.key', 'equalto', 'mcp') | first
          ).status | default(0) | int != 200 else [])
        + (
          ['Account token counts did not return to their pre-test values after token hygiene.']
          if live_service_token_counts != live_service_token_counts_before_noop else [])
        + (
          ['OpenBao secret versions changed during token hygiene.']
          if (
            live_service_account_values | dict2items
            | map(attribute='value.version') | list
          ) != (
            live_service_secret_versions_before_noop | dict2items
            | sort(attribute='key') | map(attribute='value') | list
          ) else []) }}
  no_log: true

- name: Run account reconciliation again with no extra tokens
  ansible.builtin.include_tasks: run_server_accounts.yml

- name: Record an unexpected changed result on the post-sweep no-op run
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures + (
        ['Service account reconciliation reported changes after the extra token was removed.']
        if server_service_token_sweep_changed | default(false) | bool else []) }}
  no_log: true

- name: Reload published account secrets after the post-sweep no-op run
  ansible.builtin.include_tasks: load_live_service_secrets.yml

- name: Capture token counts after the post-sweep no-op run
  ansible.builtin.include_tasks: collect_live_service_token_counts.yml

- name: Record post-sweep no-op token or secret changes
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures
        + (
          ['Service account tokens changed during the post-sweep no-op run.']
          if live_service_token_counts != live_service_token_counts_before_noop else [])
        + (
          ['OpenBao secret versions changed during the post-sweep no-op run.']
          if (
            live_service_account_values | dict2items
            | map(attribute='value.version') | list
          ) != (
            live_service_secret_versions_before_noop | dict2items
            | sort(attribute='key') | map(attribute='value') | list
          ) else []) }}
  no_log: true
