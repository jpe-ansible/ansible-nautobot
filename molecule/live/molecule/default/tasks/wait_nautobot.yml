---
# Nautobot answers anonymous status requests with 403, so readiness is
# polled with the scenario token.
- name: Poll the authenticated Nautobot status endpoint
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/status/"
    method: GET
    headers:
      Authorization: "Token {{ live_test_token }}"
    status_code: 200
    return_content: false
    timeout: 2
  register: live_status_response
  failed_when: false
  retries: "{{ live_status_retries }}"
  delay: 5
  until: live_status_response.status | default(0) | int == 200
  no_log: true

- name: Require a ready Nautobot API
  ansible.builtin.assert:
    that:
      - live_status_response.status | default(0) | int == 200
    fail_msg: Nautobot did not answer the authenticated status endpoint in time.
