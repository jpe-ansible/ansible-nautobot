---
- name: Load server role defaults for live account assertions
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../../../roles/server/defaults/main.yml"
    name: live_server_defaults

- name: Load inbound sync Bootstrap defaults for live account assertions
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../../../roles/sync_in/defaults/main/05_bootstrap.yml"
    name: live_sync_in_bootstrap_defaults

- name: Load shared Bootstrap data for the repository allow case
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../../../global_settings.yml"
    name: live_global_settings

- name: Load the Bootstrap branch from the shared develop settings
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../../../develop.yml"
    name: live_develop_settings

- name: Select the branch of the default Git repository entry
  ansible.builtin.set_fact:
    live_bootstrap_branch: >-
      {{ live_develop_settings.git_repository | selectattr('name', 'equalto', 'default')
         | map(attribute='branch') | first }}

- name: Initialize live service account assertion failures
  ansible.builtin.set_fact:
    live_service_account_failures: []

- name: Verify live service account token authentication and expiration
  ansible.builtin.include_tasks: verify_service_account_auth.yml

- name: Verify live reader boundaries
  ansible.builtin.include_tasks: verify_service_account_readers.yml

- name: Verify live writer object permissions
  ansible.builtin.include_tasks: verify_service_account_writer.yml

- name: Verify live Bootstrap and saved query permissions
  ansible.builtin.include_tasks: verify_service_account_bootstrap.yml

- name: Verify live account token hygiene and no-op reconciliation
  ansible.builtin.include_tasks: verify_service_account_hygiene.yml

- name: Require every live service account assertion to pass
  ansible.builtin.assert:
    that:
      - live_service_account_failures | length == 0
    fail_msg: "{{ live_service_account_failures | join('; ') }}"
