---
- name: Read the published service account secrets from the scenario store
  ansible.builtin.uri:
    url: >-
      {{ live_openbao_addr }}/v1/{{ live_openbao_mount }}/data/{{ item.value.path }}
    method: GET
    headers:
      X-Vault-Token: "{{ live_openbao_root_token }}"
    status_code: 200
    return_content: true
  loop: "{{ live_service_account_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: live_service_secret_reads
  no_log: true

- name: Save the service account token fields and KV versions in memory
  ansible.builtin.set_fact:
    live_service_account_values: >-
      {{ live_service_account_values | default({}) | combine({
        item.item.key: {
          'token': item.json.data.data[item.item.value.token_key],
          'url': item.json.data.data[item.item.value.url_key],
          'version': item.json.data.metadata.version
        }
      }) }}
  loop: "{{ live_service_secret_reads.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  no_log: true

- name: Require all service token and URL fields to be present
  ansible.builtin.assert:
    that:
      - live_service_account_values | length == 4
      - item.value.token | default('') | length > 0
      - item.value.url | default('') == live_nautobot_url
    fail_msg: "{{ item.key }} service account secret is missing its token or URL field."
    quiet: true
  loop: "{{ live_service_account_values | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
