---
- name: Resolve the Bootstrap repository URL from shared settings
  ansible.builtin.set_fact:
    live_bootstrap_repo_url: >-
      {{ live_global_settings.git_repository
         | selectattr('name', 'equalto', live_sync_in_bootstrap_defaults.sync_in_bootstrap_repo_name)
         | map(attribute='url') | first }}

- name: Create the Bootstrap-named repository with the writer token
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/extras/git-repositories/"
    method: POST
    headers:
      Authorization: "Token {{ live_service_account_values.writer.token }}"
      Accept: application/json
    body_format: json
    body:
      name: "{{ live_sync_in_bootstrap_defaults.sync_in_bootstrap_repo_name }}"
      remote_url: "{{ live_bootstrap_repo_url }}"
      branch: "{{ live_bootstrap_branch }}"
      provided_contents:
        - extras.configcontext
    status_code: [201, 400, 403]
    return_content: true
  register: live_bootstrap_repository_create
  no_log: true

- name: Create an unrelated repository with the scenario superuser
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/extras/git-repositories/"
    method: POST
    headers:
      Authorization: "Token {{ live_test_token }}"
      Accept: application/json
    body_format: json
    body:
      name: account-permission-other
      remote_url: "{{ live_bootstrap_repo_url }}/other.git"
      branch: "{{ live_bootstrap_branch }}"
      provided_contents:
        - extras.configcontext
    status_code: [201, 400]
    return_content: true
  register: live_other_repository_create
  no_log: true

- name: Try to repoint the unrelated repository with the writer token
  ansible.builtin.uri:
    url: >-
      {{ live_nautobot_url }}/api/extras/git-repositories/{{ live_other_repository_create.json.id }}/
    method: PATCH
    headers:
      Authorization: "Token {{ live_service_account_values.writer.token }}"
      Accept: application/json
    body_format: json
    body:
      remote_url: "{{ live_bootstrap_repo_url }}/permission-probe.git"
    status_code: [200, 400, 403, 404]
    return_content: true
  register: live_other_repository_patch
  when: live_other_repository_create.status | default(0) | int == 201
  no_log: true

- name: Read the saved export query with the scenario superuser
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/extras/graphql-queries/?name=nautobot-export"
    method: GET
    headers:
      Authorization: "Token {{ live_test_token }}"
      Accept: application/json
    status_code: 200
    return_content: true
  register: live_export_query_lookup
  no_log: true

- name: Try to run the saved export query with the pipeline reader token
  ansible.builtin.uri:
    url: >-
      {{ live_nautobot_url }}/api/extras/graphql-queries/{{ live_export_query_lookup.json.results[0].id }}/run/
    method: POST
    headers:
      Authorization: "Token {{ live_service_account_values.pipeline.token }}"
      Accept: application/json
    body_format: json
    body: {}
    status_code: [200, 201, 400, 403, 404]
    return_content: true
  register: live_pipeline_saved_query_run
  no_log: true

- name: Read stock Nautobot jobs with the scenario superuser
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/extras/jobs/?limit=1000"
    method: GET
    headers:
      Authorization: "Token {{ live_test_token }}"
      Accept: application/json
    status_code: 200
    return_content: true
  register: live_stock_job_catalog
  no_log: true

- name: Select one stock Job other than the Bootstrap job
  ansible.builtin.set_fact:
    live_other_stock_job: >-
      {{ live_stock_job_catalog.json.results | default([])
         | rejectattr('name', 'equalto', live_sync_in_bootstrap_defaults.sync_in_bootstrap_job_name)
         | first | default({}) }}

- name: Enable the selected stock Job for the denial probe
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/extras/jobs/{{ live_other_stock_job.id }}/"
    method: PATCH
    headers:
      Authorization: "Token {{ live_test_token }}"
      Accept: application/json
    body_format: json
    body:
      enabled: true
    status_code: [200, 400, 404]
    return_content: true
  register: live_other_stock_job_enable
  when: live_other_stock_job.id is defined
  no_log: true

- name: Try to run the selected stock Job with the writer token
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/extras/jobs/{{ live_other_stock_job.id }}/run/"
    method: POST
    headers:
      Authorization: "Token {{ live_service_account_values.writer.token }}"
      Accept: application/json
    body_format: json
    body:
      data: {}
    status_code: [201, 400, 403, 404, 503]
    return_content: true
  register: live_other_stock_job_run
  when:
    - live_other_stock_job.id is defined
    - live_other_stock_job_enable.status | default(0) | int == 200
  no_log: true

- name: Record live Bootstrap and saved query permission failures
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures
        + (
          ['Writer could not create the Bootstrap-named GitRepository (HTTP '
          ~ (live_bootstrap_repository_create.status | default(0) | string) ~ ').']
          if live_bootstrap_repository_create.status | default(0) | int != 201 else [])
        + (
          ['Could not create the unrelated GitRepository control object.']
          if live_other_repository_create.status | default(0) | int != 201 else [])
        + (
          ['Writer repointed a GitRepository outside the Bootstrap name constraint (HTTP '
          ~ (live_other_repository_patch.status | default(0) | string) ~ ').']
          if live_other_repository_create.status | default(0) | int == 201 and
             live_other_repository_patch.status | default(0) | int not in [403, 404] else [])
        + (
          ['The saved export query was not available to the scenario superuser.']
          if live_export_query_lookup.json.results | default([]) | length != 1 else [])
        + (
          ['Pipeline reader did not receive HTTP 403 for a saved-query run action (HTTP '
          ~ (live_pipeline_saved_query_run.status | default(0) | string) ~ ').']
          if live_pipeline_saved_query_run.status | default(0) | int != 403 else [])
        + (
          ['No stock Job was available for the denial probe.']
          if live_other_stock_job.id is not defined else [])
        + (
          ['The stock Job could not be enabled for the denial probe.']
          if live_other_stock_job.id is defined and
             live_other_stock_job_enable.status | default(0) | int != 200 else [])
        + (
          ['Writer ran a stock Job outside the Bootstrap name constraint (HTTP '
          ~ (live_other_stock_job_run.status | default(0) | string) ~ ').']
          if live_other_stock_job.id is defined and
             live_other_stock_job_enable.status | default(0) | int == 200 and
             live_other_stock_job_run.status | default(0) | int not in [403, 404] else []) }}
  no_log: true
