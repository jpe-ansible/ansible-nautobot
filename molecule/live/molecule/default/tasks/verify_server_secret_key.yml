---
- name: Gather controller account facts for the temporary SECRET_KEY files
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Create a private directory for the SECRET_KEY test files
  ansible.builtin.file:
    path: "{{ live_state_dir }}/secret-key"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0700"

- name: Resolve a generated SECRET_KEY using the live secret store
  ansible.builtin.include_role:
    name: server
    tasks_from: secret_key
  vars:
    server_manage_app: true
    server_user: "{{ ansible_facts.user_id }}"
    server_group: "{{ ansible_facts.user_gid }}"
    server_secret_key_file: "{{ live_state_dir }}/secret-key/generated"
    server_secret_key_path: scenario/secret-key
    server_openbao_addr: "{{ live_openbao_addr }}"
    server_openbao_mount: "{{ live_openbao_mount }}"
    server_openbao_token: "{{ live_openbao_root_token }}"
    server_openbao_ca_file: "{{ live_openbao_ca_file }}"
  no_log: true

- name: Read the generated host key and its OpenBao version
  block:
    - name: Read the generated SECRET_KEY file
      ansible.builtin.slurp:
        src: "{{ live_state_dir }}/secret-key/generated"
      register: live_secret_key_generated_file
      no_log: true

    - name: Check the generated SECRET_KEY file mode
      ansible.builtin.stat:
        path: "{{ live_state_dir }}/secret-key/generated"
      register: live_secret_key_generated_stat

    - name: Read the generated SECRET_KEY secret
      ansible.builtin.uri:
        url: "{{ live_openbao_addr }}/v1/{{ live_openbao_mount }}/data/scenario/secret-key"
        method: GET
        headers:
          X-Vault-Token: "{{ live_openbao_root_token }}"
        status_code: 200
        validate_certs: true
      register: live_secret_key_generated_secret
      no_log: true

- name: Assert the first run generated, persisted and published one SECRET_KEY
  ansible.builtin.assert:
    that:
      - live_secret_key_generated_file.content | b64decode | length > 0
      - live_secret_key_generated_stat.stat.mode == '0600'
      - live_secret_key_generated_secret.json.data.metadata.version | int == 1
      - >-
        live_secret_key_generated_secret.json.data.data.secret_key
        == live_secret_key_generated_file.content | b64decode
    fail_msg: The first SECRET_KEY run did not publish the generated key as KV version 1.
  no_log: true

- name: Save the generated key in memory for later comparisons
  ansible.builtin.set_fact:
    live_secret_key_generated_value: "{{ live_secret_key_generated_file.content | b64decode }}"
  no_log: true

- name: Resolve SECRET_KEY a second time without changes
  ansible.builtin.include_role:
    name: server
    tasks_from: secret_key
  vars:
    server_manage_app: true
    server_user: "{{ ansible_facts.user_id }}"
    server_group: "{{ ansible_facts.user_gid }}"
    server_secret_key_file: "{{ live_state_dir }}/secret-key/generated"
    server_secret_key_path: scenario/secret-key
    server_openbao_addr: "{{ live_openbao_addr }}"
    server_openbao_mount: "{{ live_openbao_mount }}"
    server_openbao_token: "{{ live_openbao_root_token }}"
    server_openbao_ca_file: "{{ live_openbao_ca_file }}"
  no_log: true

- name: Read the unchanged SECRET_KEY version
  ansible.builtin.uri:
    url: "{{ live_openbao_addr }}/v1/{{ live_openbao_mount }}/data/scenario/secret-key"
    method: GET
    headers:
      X-Vault-Token: "{{ live_openbao_root_token }}"
    status_code: 200
    validate_certs: true
  register: live_secret_key_second_secret
  no_log: true

- name: Assert the second run makes no writes and keeps KV version 1
  ansible.builtin.assert:
    that:
      - not server_secret_key_file_write.changed | default(false)
      - not server_secret_key_publish_result.changed | default(false)
      - live_secret_key_second_secret.json.data.metadata.version | int == 1
      - live_secret_key_second_secret.json.data.data.secret_key == live_secret_key_generated_value
    fail_msg: The unchanged SECRET_KEY run wrote a file or advanced the OpenBao version.
  no_log: true

- name: Remove the host key to simulate a rebuilt host
  ansible.builtin.file:
    path: "{{ live_state_dir }}/secret-key/generated"
    state: absent

- name: Recreate the host SECRET_KEY from the stored value
  ansible.builtin.include_role:
    name: server
    tasks_from: secret_key
  vars:
    server_manage_app: true
    server_user: "{{ ansible_facts.user_id }}"
    server_group: "{{ ansible_facts.user_gid }}"
    server_secret_key_file: "{{ live_state_dir }}/secret-key/generated"
    server_secret_key_path: scenario/secret-key
    server_openbao_addr: "{{ live_openbao_addr }}"
    server_openbao_mount: "{{ live_openbao_mount }}"
    server_openbao_token: "{{ live_openbao_root_token }}"
    server_openbao_ca_file: "{{ live_openbao_ca_file }}"
  no_log: true

- name: Read the rebuilt host key and stored version
  block:
    - name: Read the rebuilt SECRET_KEY file
      ansible.builtin.slurp:
        src: "{{ live_state_dir }}/secret-key/generated"
      register: live_secret_key_rebuilt_file
      no_log: true

    - name: Read the rebuilt SECRET_KEY secret
      ansible.builtin.uri:
        url: "{{ live_openbao_addr }}/v1/{{ live_openbao_mount }}/data/scenario/secret-key"
        method: GET
        headers:
          X-Vault-Token: "{{ live_openbao_root_token }}"
        status_code: 200
        validate_certs: true
      register: live_secret_key_rebuilt_secret
      no_log: true

- name: Assert a rebuilt host reuses the stored key without publishing
  ansible.builtin.assert:
    that:
      - live_secret_key_rebuilt_file.content | b64decode == live_secret_key_generated_value
      - live_secret_key_rebuilt_secret.json.data.metadata.version | int == 1
      - not server_secret_key_publish_result.changed | default(false)
      - server_secret_key_file_write.changed | default(false)
    fail_msg: A rebuilt host did not reuse the stored key without a new OpenBao version.
  no_log: true

- name: Replace the host key with a stale value
  ansible.builtin.copy:
    content: stale-local-key
    dest: "{{ live_state_dir }}/secret-key/generated"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0600"
  no_log: true

- name: Restore the stored SECRET_KEY over a stale host file
  ansible.builtin.include_role:
    name: server
    tasks_from: secret_key
  vars:
    server_manage_app: true
    server_user: "{{ ansible_facts.user_id }}"
    server_group: "{{ ansible_facts.user_gid }}"
    server_secret_key_file: "{{ live_state_dir }}/secret-key/generated"
    server_secret_key_path: scenario/secret-key
    server_openbao_addr: "{{ live_openbao_addr }}"
    server_openbao_mount: "{{ live_openbao_mount }}"
    server_openbao_token: "{{ live_openbao_root_token }}"
    server_openbao_ca_file: "{{ live_openbao_ca_file }}"
  no_log: true

- name: Read the restored SECRET_KEY version
  ansible.builtin.uri:
    url: "{{ live_openbao_addr }}/v1/{{ live_openbao_mount }}/data/scenario/secret-key"
    method: GET
    headers:
      X-Vault-Token: "{{ live_openbao_root_token }}"
    status_code: 200
    validate_certs: true
  register: live_secret_key_restored_secret
  no_log: true

- name: Assert the stored SECRET_KEY wins over a stale host file
  ansible.builtin.assert:
    that:
      - server_secret_key_file_write.changed | default(false)
      - not server_secret_key_publish_result.changed | default(false)
      - live_secret_key_restored_secret.json.data.metadata.version | int == 1
      - live_secret_key_restored_secret.json.data.data.secret_key == live_secret_key_generated_value
    fail_msg: The stale host key was not replaced by the stored SECRET_KEY.
  no_log: true

- name: Seed a second SECRET_KEY path with a sibling field and existing key
  ansible.builtin.uri:
    url: "{{ live_openbao_addr }}/v1/{{ live_openbao_mount }}/data/scenario/secret-key-sibling"
    method: POST
    headers:
      X-Vault-Token: "{{ live_openbao_root_token }}"
    body_format: json
    body:
      options:
        cas: 0
      data:
        secret_key: previous-test-key
        sibling_field: preserved
    status_code: [200, 204]
    validate_certs: true
  register: live_secret_key_sibling_seed
  no_log: true

- name: Generate a caller-supplied SECRET_KEY for the override case
  ansible.builtin.set_fact:
    live_secret_key_override: "{{ lookup('ansible.builtin.password', '/dev/null length=64') }}"
  no_log: true

- name: Resolve a caller-supplied SECRET_KEY over the stored value
  ansible.builtin.include_role:
    name: server
    tasks_from: secret_key
  vars:
    server_manage_app: true
    server_secret_key: "{{ live_secret_key_override }}"
    server_user: "{{ ansible_facts.user_id }}"
    server_group: "{{ ansible_facts.user_gid }}"
    server_secret_key_file: "{{ live_state_dir }}/secret-key/supplied"
    server_secret_key_path: scenario/secret-key-sibling
    server_openbao_addr: "{{ live_openbao_addr }}"
    server_openbao_mount: "{{ live_openbao_mount }}"
    server_openbao_token: "{{ live_openbao_root_token }}"
    server_openbao_ca_file: "{{ live_openbao_ca_file }}"
  no_log: true

- name: Read the caller-supplied SECRET_KEY secret
  ansible.builtin.uri:
    url: "{{ live_openbao_addr }}/v1/{{ live_openbao_mount }}/data/scenario/secret-key-sibling"
    method: GET
    headers:
      X-Vault-Token: "{{ live_openbao_root_token }}"
    status_code: 200
    validate_certs: true
  register: live_secret_key_sibling_secret
  no_log: true

- name: Assert the sibling test secret was seeded successfully
  ansible.builtin.assert:
    that: live_secret_key_sibling_seed is succeeded
    fail_msg: The sibling test secret was not seeded successfully.
  no_log: true

- name: Assert the caller override advanced the sibling secret to KV version 2
  ansible.builtin.assert:
    that: live_secret_key_sibling_secret.json.data.metadata.version | int == 2
    fail_msg: The caller override did not advance the sibling secret to KV version 2.
  no_log: true

- name: Assert the stored SECRET_KEY matches the caller override
  ansible.builtin.assert:
    that: live_secret_key_sibling_secret.json.data.data.secret_key == live_secret_key_override
    fail_msg: The stored SECRET_KEY does not match the caller override.
  no_log: true

- name: Assert the caller override preserved the sibling secret field
  ansible.builtin.assert:
    that: live_secret_key_sibling_secret.json.data.data.sibling_field == 'preserved'
    fail_msg: The caller override did not preserve the sibling secret field.
  no_log: true

- name: Assert the caller override was written to the host key file
  ansible.builtin.assert:
    that: server_secret_key_file_write.changed | default(false)
    fail_msg: The caller override did not update the host key file.
  no_log: true

- name: Assert the caller override was published to OpenBao
  ansible.builtin.assert:
    that: server_secret_key_publish_result.changed | default(false)
    fail_msg: The caller override was not published to OpenBao.
  no_log: true
