---
- name: Create an isolated Location for the writer delete check
  networktocode.nautobot.location:
    url: "{{ live_nautobot_url }}"
    token: "{{ live_test_token }}"
    validate_certs: true
    name: account-permission-probe
    parent_location: homelab
    location_type: Site
    status: Active
    state: present
  no_log: true

- name: Create an isolated Prefix for the writer delete check
  networktocode.nautobot.prefix:
    url: "{{ live_nautobot_url }}"
    token: "{{ live_test_token }}"
    validate_certs: true
    prefix: 203.0.113.0/24
    namespace: Global
    status: Active
    type: Network
    state: present
  no_log: true

- name: Read the test Location with the scenario superuser
  ansible.builtin.uri:
    url: >-
      {{ live_nautobot_url }}/api/dcim/locations/?name={{ 'account-permission-probe' | urlencode }}
    method: GET
    headers:
      Authorization: "Token {{ live_test_token }}"
      Accept: application/json
    status_code: 200
    return_content: true
  register: live_writer_location_probe
  no_log: true

- name: Read the test Prefix with the scenario superuser
  ansible.builtin.uri:
    url: >-
      {{ live_nautobot_url }}/api/ipam/prefixes/?prefix={{ '203.0.113.0/24' | urlencode }}
    method: GET
    headers:
      Authorization: "Token {{ live_test_token }}"
      Accept: application/json
    status_code: 200
    return_content: true
  register: live_writer_prefix_probe
  no_log: true

- name: Create a flow-owned VirtualMachine with the writer token
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/virtualization/virtual-machines/"
    method: POST
    headers:
      Authorization: "Token {{ live_service_account_values.writer.token }}"
      Accept: application/json
    body_format: json
    body:
      name: writer-permission-probe
      cluster: "{{ live_adoption_cluster_id }}"
      status: "{{ live_active_status_id }}"
      vcpus: 1
      memory: 1
      disk: 1
      custom_fields:
        sync_source: proxmox
        vmid: 900001
    status_code: [201, 400, 403]
    return_content: true
  register: live_writer_vm_create
  no_log: true

- name: Delete the flow-owned VirtualMachine with the writer token
  ansible.builtin.uri:
    url: >-
      {{ live_nautobot_url }}/api/virtualization/virtual-machines/{{ live_writer_vm_create.json.id }}/
    method: DELETE
    headers:
      Authorization: "Token {{ live_service_account_values.writer.token }}"
      Accept: application/json
    status_code: [200, 204, 403, 404]
    return_content: true
  register: live_writer_vm_delete
  when: live_writer_vm_create.status | default(0) | int == 201
  no_log: true

- name: Try to delete the flow-owned test Location with the writer token
  ansible.builtin.uri:
    url: >-
      {{ live_nautobot_url }}/api/dcim/locations/{{ live_writer_location_probe.json.results[0].id }}/
    method: DELETE
    headers:
      Authorization: "Token {{ live_service_account_values.writer.token }}"
      Accept: application/json
    status_code: [200, 204, 403, 404]
    return_content: true
  register: live_writer_location_delete
  when: live_writer_location_probe.json.results | default([]) | length == 1
  no_log: true

- name: Try to delete the flow-owned test Prefix with the writer token
  ansible.builtin.uri:
    url: >-
      {{ live_nautobot_url }}/api/ipam/prefixes/{{ live_writer_prefix_probe.json.results[0].id }}/
    method: DELETE
    headers:
      Authorization: "Token {{ live_service_account_values.writer.token }}"
      Accept: application/json
    status_code: [200, 204, 403, 404]
    return_content: true
  register: live_writer_prefix_delete
  when: live_writer_prefix_probe.json.results | default([]) | length == 1
  no_log: true

- name: Record live writer model permission failures
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures
        + (
          ['Writer could not create a flow-owned VirtualMachine (HTTP '
          ~ (live_writer_vm_create.status | default(0) | string) ~ ').']
          if live_writer_vm_create.status | default(0) | int != 201 else [])
        + (
          ['Writer VirtualMachine did not carry sync_source=proxmox.']
          if live_writer_vm_create.status | default(0) | int == 201 and
             live_writer_vm_create.json.custom_fields.sync_source | default('') != 'proxmox' else [])
        + (
          ['Writer could not delete its flow-owned VirtualMachine (HTTP '
          ~ (live_writer_vm_delete.status | default(0) | string) ~ ').']
          if live_writer_vm_create.status | default(0) | int == 201 and
             live_writer_vm_delete.status | default(0) | int not in [200, 204] else [])
        + (
          ['The isolated Location delete target was not found.']
          if live_writer_location_probe.json.results | default([]) | length != 1 else [])
        + (
          ['Writer received HTTP '
          ~ (live_writer_location_delete.status | default(0) | string)
          ~ ' instead of HTTP 403 on Location DELETE.']
          if live_writer_location_delete.status | default(0) | int != 403 else [])
        + (
          ['The isolated Prefix delete target was not found.']
          if live_writer_prefix_probe.json.results | default([]) | length != 1 else [])
        + (
          ['Writer received HTTP '
          ~ (live_writer_prefix_delete.status | default(0) | string)
          ~ ' instead of HTTP 403 on Prefix DELETE.']
          if live_writer_prefix_delete.status | default(0) | int != 403 else []) }}
  no_log: true
