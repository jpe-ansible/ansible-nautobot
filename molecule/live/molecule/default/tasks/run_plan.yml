---
# Runs all inbound sync stages in plan-only mode; the caller sets live_plan_module_quantity.
- name: Plan all inbound stages without writes
  ansible.builtin.include_role:
    name: sync_in
  vars:
    sync_in_stages:
      - proxmox
      - curated
    sync_in_plan_only: true
    sync_in_pve_node_map: "{{ live_pve_node_map }}"
    sync_in_racks: "{{ live_curated_racks }}"
    sync_in_devices: "{{ live_curated_devices }}"
    sync_in_wan_circuits: "{{ live_curated_wan_circuits }}"
    sync_in_hardware_modules: "{{ [live_curated_module | combine({'quantity': live_plan_module_quantity})] }}"
    sync_in_nautobot_url: "{{ live_nautobot_url }}"
    sync_in_read_token: "{{ live_service_account_values.writer.token }}"
    sync_in_pve_api_url: "{{ live_proxmox_api_url }}"
    sync_in_pve_token_id: "{{ live_pve_token_id }}"
    sync_in_pve_token_secret: "{{ live_pve_token_secret }}"
    sync_in_pve_ca_path: "{{ live_state_dir }}/tls/ca.crt"
    sync_in_pve_api_timeout: 10
    sync_in_prune_max_fraction: 0.5
  no_log: true
