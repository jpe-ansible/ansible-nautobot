---
- name: Read each managed service account token list
  ansible.builtin.uri:
    url: "{{ live_nautobot_url }}/api/users/tokens/"
    method: GET
    headers:
      Authorization: "Token {{ item.value.token }}"
      Accept: application/json
    status_code: [200, 401, 403, 404]
    return_content: true
  loop: "{{ live_service_account_values | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: live_service_account_token_probes
  no_log: true

- name: Record failed service account token probes
  ansible.builtin.set_fact:
    live_service_account_failures: >-
      {{ live_service_account_failures + (
        ['Service account token failed authentication for ' ~ item.item.key ~ ' (HTTP '
        ~ (item.status | default(0) | string) ~ ').']
        if item.status | default(0) | int != 200 else [])
        + (
          ['Service account token metadata was missing for ' ~ item.item.key ~ '.']
          if item.status | default(0) | int == 200 and (
            item.json.results | default([])
            | selectattr('description', 'equalto', item.item.key)
            | selectattr('write_enabled', 'equalto', true)
            | list | length == 0
          ) else [])
        + (
          ['Service account token expires for ' ~ item.item.key ~ '.']
          if item.status | default(0) | int == 200 and (
            item.json.results | default([])
            | selectattr('description', 'equalto', item.item.key)
            | selectattr('write_enabled', 'equalto', true)
            | rejectattr('expires', 'none') | list | length > 0
          ) else []) }}
  loop: "{{ live_service_account_token_probes.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  no_log: true
