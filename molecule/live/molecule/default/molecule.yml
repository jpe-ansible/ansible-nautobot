---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../requirements.yml

driver:
  name: default

provisioner:
  name: ansible
  # An explicit localhost host replaces Ansible's implicit one, which always
  # runs modules with the interpreter that started ansible-playbook. Delegated
  # tasks then use the controller packages named by NAUTOBOT_LIVE_PYTHON.
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: >-
              {{ lookup('ansible.builtin.env', 'NAUTOBOT_LIVE_PYTHON') | default(ansible_playbook_python, true) }}
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/../../roles
  playbooks:
    create: create.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
    cleanup: cleanup.yml
    destroy: destroy.yml

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
