---
# NAUTOBOT_LIVE_PREFIX names this stack, so two runs can share one container host without sharing resources.
live_prefix: "{{ lookup('ansible.builtin.env', 'NAUTOBOT_LIVE_PREFIX') | default('nautobot-live', true) }}"
live_network_name: "{{ live_prefix }}-network"
live_postgres_name: "{{ live_prefix }}-postgres"
live_redis_name: "{{ live_prefix }}-redis"
live_nautobot_name: "{{ live_prefix }}-nautobot"
live_proxmox_name: "{{ live_prefix }}-proxmox"
live_openbao_name: "{{ live_prefix }}-openbao"
live_openbao_mount: secret
live_container_names:
  - "{{ live_postgres_name }}"
  - "{{ live_redis_name }}"
  - "{{ live_nautobot_name }}"
  - "{{ live_proxmox_name }}"
  - "{{ live_openbao_name }}"
live_owner_value: "{{ live_prefix }}"
live_state_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/live"
# OpenBao answers on loopback http, so this CA file only has to exist; the scenario CA does on every OS.
live_openbao_ca_file: "{{ live_state_dir }}/tls/ca.crt"
# The disposable superuser token is generated by create.yml and used for scenario setup and assertions.
live_pve_token_id: test@pve!live
live_pve_token_secret: "{{ live_test_token }}"
live_prefixes:
  - 192.0.2.0/24
  - 198.51.100.0/24
live_pve_node_map:
  - name: node-a
    nautobot_device_name: mapped-node-a
    commissioned: true
    management_dns_name: node-a
  - name: node-b
    nautobot_device_name: node-b
    commissioned: true
    management_dns_name: node-b
  - name: node-c
    nautobot_device_name: node-c
    commissioned: false
    management_dns_name: node-c
  - name: node-d
    nautobot_device_name: node-d
    commissioned: true
    management_dns_name: node-d
live_curated_racks:
  - name: Live Rack
    site: homelab
live_curated_devices:
  - name: live-curated-device
    chassis: Live Placement Chassis
    role: server
    service_tag: LIVE-PLACEMENT-DEVICE
    rack: Live Rack
    position: 7
    face: front
    height: 4
  - name: live-node-role-row
    chassis: Ignored Node Chassis
    role: pve-node
    service_tag: LIVE-IGNORED-NODE-ROLE
live_curated_wan_circuits:
  - circuit_id: WAN-LIVE-CURATED
    provider: Example Transit Provider
    circuit_type: Internet
    priority: 1
    status: Active
    description: Curated live WAN circuit
live_curated_module:
  hw_id: MODULE-LIVE
  category: memory
  manufacturer: Example
  model: Synthetic DIMM
  part_number: TEST-DIMM
  status: Active
  location: storage
live_service_account_secrets:
  inventory:
    path: scenario/inventory
    token_key: inventory_ro_token
    url_key: inventory_url
  mcp:
    path: scenario/mcp
    token_key: NAUTOBOT_MCP_TOKEN
    url_key: NAUTOBOT_MCP_URL
  pipeline:
    path: scenario/pipeline
    token_key: pipeline_ro_token
    url_key: pipeline_url
  writer:
    path: scenario/writer
    token_key: sync_write_token
    url_key: sync_write_url

# renovate: datasource=docker depName=postgres
live_postgres_image: postgres:17.11-alpine3.24
# renovate: datasource=docker depName=redis
live_redis_image: redis:7.4.11-alpine3.21
# renovate: datasource=docker depName=nginx
live_nginx_image: nginx:1.30.5-alpine3.24
# renovate: datasource=docker depName=openbao/openbao
live_openbao_image: openbao/openbao:2.5.5
# renovate: datasource=docker depName=networktocode/nautobot
live_nautobot_image_repository: networktocode/nautobot
