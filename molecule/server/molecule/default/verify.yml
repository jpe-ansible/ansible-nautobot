---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  vars:
    server_root: /opt/nautobot
    server_ui_fqdn: nautobot.example.test
    server_db_host: postgres.example.test
    server_superuser_password: molecule-superuser-placeholder
    server_bootstrap_expected_models:
      custom_field: true
      git_repository: true
      tag: true
      location_type: true
      location: true
      manufacturer: true
      role: false
      provider: true
      circuit_type: true
      circuit: true
      vlan: true
      prefix: true
    server_bootstrap_guard_cases:
      - name: enabled without the DLM plugin
        enabled: true
        plugins: []
        packages: ["nautobot-device-lifecycle-mgmt==1.0"]
        rejected: true
      - name: enabled without the DLM package
        enabled: true
        plugins: [nautobot_device_lifecycle_mgmt]
        packages: []
        rejected: true
      - name: enabled with the DLM plugin and package
        enabled: true
        plugins: [nautobot_device_lifecycle_mgmt]
        packages: ["nautobot-device-lifecycle-mgmt[extra]==1.0"]
        rejected: false
      - name: disabled without DLM
        enabled: false
        plugins: []
        packages: []
        rejected: false
  tasks:
    - name: Load the server role defaults for contract assertions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../roles/server/defaults/main.yml"
        name: server_role_defaults

    - name: Load the server role argument specification for contract assertions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../roles/server/meta/argument_specs.yml"
        name: server_role_specs

    - name: Load the inbound sync Bootstrap identifiers for permission assertions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../roles/sync_in/defaults/main/05_bootstrap.yml"
        name: server_sync_in_bootstrap_defaults

    - name: Read the server account declarations for permission assertions
      ansible.builtin.set_fact:
        server_account_task_definitions: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../../../roles/server/tasks/accounts.yml')
          | from_yaml }}
      delegate_to: localhost
      become: false

    - name: Select the managed service account permission definitions
      ansible.builtin.set_fact:
        server_service_account_definitions: >-
          {{ (server_account_task_definitions
          | selectattr('name', 'equalto', 'Define the managed Nautobot service accounts')
          | first)['ansible.builtin.set_fact']['server_service_accounts'] }}
      delegate_to: localhost
      become: false

    - name: Assert MCP account publication uses the consumer contract
      ansible.builtin.assert:
        that:
          - server_role_defaults.server_mcp_username == 'svc-mcp-ro'
          - server_role_defaults.server_mcp_token_path == 'ai/mcp/nautobot'
          - server_role_defaults.server_mcp_token_key == 'NAUTOBOT_MCP_TOKEN'
          - server_role_defaults.server_mcp_url_key == 'NAUTOBOT_MCP_URL'
        fail_msg: MCP token publication does not match the consumer contract.

    - name: Assert least-privilege permission defaults follow the sync_in flow identifiers
      ansible.builtin.assert:
        that:
          - >-
            server_role_defaults.server_bootstrap_repository_name | default('')
            == server_sync_in_bootstrap_defaults.sync_in_bootstrap_repo_name
          - >-
            server_role_defaults.server_bootstrap_job_name | default('')
            == server_sync_in_bootstrap_defaults.sync_in_bootstrap_job_name
          - server_role_defaults.server_write_delete_types | default([]) == [
              'dcim.device',
              'dcim.inventoryitem',
              'dcim.module',
              'dcim.modulebay',
              'ipam.ipaddress',
              'virtualization.cluster',
              'virtualization.virtualmachine',
              'virtualization.vminterface'
            ]
          - >-
            ((server_service_account_definitions | selectattr('name', 'equalto', 'writer') | first)
            .permissions | selectattr('name', 'equalto', 'ansible-sync-in-bootstrap-repository') | first)
            .constraints == {
              'name': ('{' ~ '{ server_bootstrap_repository_name ' ~ '}' ~ '}')
            }
          - >-
            ((server_service_account_definitions | selectattr('name', 'equalto', 'writer') | first)
            .permissions | selectattr('name', 'equalto', 'ansible-sync-in-bootstrap-job') | first)
            .constraints == {
              'name': ('{' ~ '{ server_bootstrap_job_name ' ~ '}' ~ '}')
            }
          - >-
            ((server_service_account_definitions | selectattr('name', 'equalto', 'writer') | first)
            .permissions | selectattr('name', 'equalto', 'ansible-sync-in-writer') | first).actions
            == ['view', 'add', 'change']
          - >-
            ((server_service_account_definitions | selectattr('name', 'equalto', 'writer') | first)
            .permissions | selectattr('name', 'equalto', 'ansible-sync-in-writer-delete') | first).object_types
            == ('{' ~ '{ server_write_delete_types ' ~ '}' ~ '}')
          - >-
            ((server_service_account_definitions | selectattr('name', 'equalto', 'writer') | first)
            .permissions | selectattr('name', 'equalto', 'ansible-sync-in-writer-delete') | first).actions
            == ['delete']
        fail_msg: Service account permissions do not match the sync_in Bootstrap identifiers and prune surface.

    - name: Read the server role task list for contract assertions
      ansible.builtin.set_fact:
        server_role_tasks: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../../../roles/server/tasks/main.yml')
          | from_yaml }}
      delegate_to: localhost
      become: false

    - name: Find every server task file for the secret command-line contract
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../../../roles/server/tasks"
        patterns: "*.yml"
        recurse: true
      register: server_task_file_search
      delegate_to: localhost
      become: false

    - name: Initialize the parsed server task documents
      ansible.builtin.set_fact:
        server_task_documents: []
      delegate_to: localhost
      become: false

    - name: Parse every server task file, including dynamically included files
      ansible.builtin.set_fact:
        server_task_documents: >-
          {{ server_task_documents + [lookup('ansible.builtin.file', item.path) | from_yaml] }}
      loop: "{{ server_task_file_search.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      delegate_to: localhost
      become: false

    - name: Scan nested tasks for environment keys and command inputs
      ansible.builtin.set_fact:
        server_task_environment_scan: >-
          {% macro scan(tasks) -%}
          {% for task in tasks | default([]) -%}
          {% if 'environment' in task -%}ENVIRONMENT_MARKER{% endif -%}
          {% for section in ['block', 'rescue', 'always'] -%}
          {% if section in task -%}{{ scan(task[section]) }}{% endif -%}
          {% endfor -%}
          {% endfor -%}
          {%- endmacro -%}
          {{ scan(server_task_documents | flatten) }}
        server_task_command_scan: >-
          {% macro scan(tasks) -%}
          {% for task in tasks | default([]) -%}
          {% for module in ['ansible.builtin.shell', 'ansible.builtin.command', 'shell', 'command'] -%}
          {% if module in task -%}
          {% set arguments = task[module] -%}
          {% if arguments is mapping -%}
          {% for argument in ['cmd', 'argv', 'stdin', 'free_form'] -%}
          {% if argument in arguments -%}{{ arguments[argument] | to_json }}{% endif -%}
          {% endfor -%}
          {% else -%}{{ arguments | to_json }}{% endif -%}
          {% endif -%}
          {% endfor -%}
          {% for section in ['block', 'rescue', 'always'] -%}
          {% if section in task -%}{{ scan(task[section]) }}{% endif -%}
          {% endfor -%}
          {% endfor -%}
          {%- endmacro -%}
          {{ scan(server_task_documents | flatten) }}
      delegate_to: localhost
      become: false

    - name: Assert no task environment or secret-bearing command input exists
      ansible.builtin.assert:
        that:
          - server_task_environment_scan is not search('ENVIRONMENT_MARKER')
          - >-
            (server_task_command_scan
            | regex_replace('\.nautobot-cmd-env\.sh', '')
            | regex_replace('\.nautobot-superuser-env\.sh', ''))
            is not search('(?i)(password|secret|token|credential|api_key|private_key)')
        fail_msg: A server task exposes secrets through an environment or command input.
      delegate_to: localhost
      become: false

    - name: Verify shell-quoted environment values survive a Bash source round trip
      vars:
        server_quote_test_values:
          MOLECULE_SECRET_QUOTE_ONE: '$HOME `literal` "double quote"'
          MOLECULE_SECRET_QUOTE_TWO: "single' quote and space"
      block:
        - name: Render the shell-quoted environment test file
          ansible.builtin.copy:
            content: |
              # Test-only environment file.
              {% for key, value in server_quote_test_values | dictsort %}
              export {{ key }}={{ value | string | quote }}
              {% endfor %}
            dest: /tmp/server-command-env-quoting-test
            mode: "0600"
          no_log: true

        - name: Stat the shell-quoted environment test file
          ansible.builtin.stat:
            path: /tmp/server-command-env-quoting-test
          register: server_quote_test_stat

        - name: Read the shell-quoted environment test file
          ansible.builtin.slurp:
            src: /tmp/server-command-env-quoting-test
          register: server_quote_test_file
          no_log: true

        - name: Source the test environment with Bash
          ansible.builtin.shell:
            cmd: >-
              . /tmp/server-command-env-quoting-test
              && printf '%s\n%s' "$MOLECULE_SECRET_QUOTE_ONE" "$MOLECULE_SECRET_QUOTE_TWO"
            executable: /bin/bash
          register: server_quote_test_result
          changed_when: false
          no_log: true

        - name: Assert file permissions, export lines and exact value round trip
          ansible.builtin.assert:
            that:
              - server_quote_test_stat.stat.mode == '0600'
              - >-
                (server_quote_test_file.content | b64decode | regex_findall('(?m)^export [A-Za-z_][A-Za-z0-9_]*='))
                | length == 2
              - server_quote_test_result.stdout_lines == [
                  server_quote_test_values.MOLECULE_SECRET_QUOTE_ONE,
                  server_quote_test_values.MOLECULE_SECRET_QUOTE_TWO
                ]
            fail_msg: Shell-quoted environment values or file permissions did not survive the round trip.
          no_log: true
      always:
        - name: Remove the shell-quoted environment test file
          ansible.builtin.file:
            path: /tmp/server-command-env-quoting-test
            state: absent

    - name: Select the three application stage blocks
      ansible.builtin.set_fact:
        server_app_blocks: >-
          {{ server_role_tasks
          | selectattr('name', 'in', server_app_block_names)
          | list }}
        server_migrate_block: >-
          {{ (server_role_tasks
          | selectattr('name', 'equalto', server_app_block_names[1])
          | first) | default({}) }}
        server_config_block: >-
          {{ (server_role_tasks
          | selectattr('name', 'equalto', server_app_block_names[2])
          | first) | default({}) }}
      vars:
        server_app_block_names:
          - Install the Nautobot application packages
          - Migrate the Nautobot database and ensure the first superuser
          - Apply the configuration, start the Nautobot services and wait for the web interface

    - name: Select the service account include and first superuser task
      ansible.builtin.set_fact:
        server_account_include_tasks: >-
          {{ server_config_block.get('block', [])
          | selectattr('name', 'equalto', 'Reconcile service accounts and API tokens')
          | list }}
        server_superuser_tasks: >-
          {{ server_migrate_block.get('block', [])
          | selectattr('name', 'equalto', 'Ensure the first Nautobot superuser exists')
          | list }}
        server_command_env_task: "{{ server_migrate_block.get('block', [])[0] | default({}) }}"

    - name: Select the superuser command, environment renderer and cleanup
      ansible.builtin.set_fact:
        server_superuser_run_tasks: >-
          {{ ((server_superuser_tasks | first | default({})).get('block', []))
          | selectattr('name', 'equalto', 'Run Nautobot createsuperuser') | list }}
        server_superuser_env_tasks: >-
          {{ ((server_superuser_tasks | first | default({})).get('block', []))
          | selectattr('name', 'equalto', 'Render the private Nautobot superuser command environment') | list }}
        server_superuser_cleanup_tasks: >-
          {{ ((server_superuser_tasks | first | default({})).get('always', []))
          | selectattr('name', 'equalto', 'Remove the private Nautobot superuser command environment') | list }}

    - name: Assert account reconciliation is guarded without disabling application setup
      ansible.builtin.assert:
        that:
          - server_app_blocks | length == 3
          - server_app_blocks | map(attribute='when') | unique | list == ['server_manage_app | bool']
          - server_account_include_tasks | length == 1
          - server_account_include_tasks[0]['ansible.builtin.include_tasks']['file'] == 'accounts.yml'
          - server_account_include_tasks[0]['when'] == 'server_manage_accounts | bool'
          - server_superuser_tasks | length == 1
          - server_superuser_run_tasks | length == 1
          - server_superuser_run_tasks[0]['ansible.builtin.shell']['cmd'] is search('createsuperuser --noinput')
          - server_superuser_run_tasks[0]['ansible.builtin.shell']['executable'] == '/bin/bash'
          - server_superuser_env_tasks | length == 1
          - server_superuser_env_tasks[0]['ansible.builtin.copy']['dest'] is search('\.nautobot-superuser-env\.sh$')
          - server_superuser_env_tasks[0]['ansible.builtin.copy']['mode'] == '0600'
          - server_superuser_env_tasks[0]['no_log'] | bool
          - server_superuser_cleanup_tasks | length == 1
          - server_superuser_cleanup_tasks[0]['ansible.builtin.file']['state'] == 'absent'
          - server_command_env_task.name == 'Render the private Nautobot command environment'
          - server_command_env_task['ansible.builtin.copy']['dest'] is search('\.nautobot-cmd-env\.sh$')
          - server_command_env_task['ansible.builtin.copy']['mode'] == '0600'
          - server_command_env_task.no_log | bool
          - server_command_env_task['ansible.builtin.copy']['content'] is search('server_env \| dictsort')
          - server_command_env_task['ansible.builtin.copy']['content'] is search('value \| string \| quote')
          - server_superuser_tasks[0].get('when') is none
        fail_msg: Service account reconciliation is not guarded by server_manage_accounts.

    - name: Read the controller-delegated task files
      ansible.builtin.set_fact:
        server_secret_key_tasks: >-
          {{ lookup('ansible.builtin.file', server_tasks_dir ~ '/secret_key.yml') | from_yaml }}
        server_accounts_tasks: >-
          {{ lookup('ansible.builtin.file', server_tasks_dir ~ '/accounts.yml') | from_yaml }}
      vars:
        server_tasks_dir: "{{ playbook_dir }}/../../../../roles/server/tasks"
      delegate_to: localhost
      become: false

    - name: Assert controller-delegated tasks disable become with the variable
      ansible.builtin.assert:
        that:
          - server_delegated | length == 3
          - server_delegated_off | length == server_delegated | length
        fail_msg: A controller-delegated task must set the variable ansible_become to false, not only the keyword.
      vars:
        server_delegated: >-
          {{ (server_secret_key_tasks + server_accounts_tasks)
          | selectattr('delegate_to', 'defined') | selectattr('delegate_to', 'equalto', 'localhost') | list }}
        server_delegated_off: >-
          {{ server_delegated | selectattr('vars.ansible_become', 'defined')
          | selectattr('vars.ansible_become', 'equalto', false) | list }}

    - name: Assert the return-code checks and the web wait are skipped under check mode
      ansible.builtin.assert:
        that:
          - server_check_mode_tasks | length == server_check_mode_task_names | length
          - server_check_mode_guarded | length == server_check_mode_task_names | length
        fail_msg: A return-code check or the web wait runs under check mode, where its command or request is skipped.
      vars:
        server_check_mode_task_names:
          - Report the migration return code
          - Require successful database migrations
          - Report the post-upgrade return code
          - Require successful post-upgrade operations
          - Wait for the Nautobot web interface to answer
        server_check_mode_tasks: >-
          {{ (server_migrate_block.get('block', []) + server_config_block.get('block', []))
          | selectattr('name', 'in', server_check_mode_task_names) | list }}
        server_check_mode_guarded: >-
          {{ server_check_mode_tasks | map(attribute='when', default='') | map('string')
          | select('search', 'not ansible_check_mode') | list }}

    - name: Assert application management remains enabled by default and manages the first superuser
      ansible.builtin.assert:
        that:
          - server_role_defaults.server_manage_app | bool
          - server_role_defaults.server_manage_accounts | bool
          - server_role_specs.argument_specs.main.options.server_manage_accounts.type == 'bool'
          - server_role_specs.argument_specs.main.options.server_manage_accounts.default | bool
          - server_role_specs.argument_specs.main.options.server_manage_accounts.description
            == 'Reconcile Nautobot service accounts, permissions, tokens and published token fields.'
          - not server_role_defaults.server_bootstrap_enabled | bool
          - server_role_specs.argument_specs.main.options.server_bootstrap_enabled.type == 'bool'
          - not server_role_specs.argument_specs.main.options.server_bootstrap_enabled.default | bool
        fail_msg: Account management defaults or its argument specification are missing.

    - name: Read the rendered Nautobot settings
      ansible.builtin.slurp:
        src: "{{ server_root }}/nautobot_config.py"
      register: server_config

    - name: Decode the rendered Nautobot settings
      ansible.builtin.set_fact:
        server_rendered_config: "{{ server_config.content | b64decode }}"

    - name: Parse the default Nautobot settings as Python
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - import ast,sys; ast.parse(open(sys.argv[1]).read())
          - "{{ server_root }}/nautobot_config.py"
      changed_when: false

    - name: Assert Bootstrap defaults match the documented model selection
      ansible.builtin.assert:
        that:
          - server_role_defaults.server_bootstrap_models_to_sync == server_bootstrap_expected_models
          - not server_role_defaults.server_bootstrap_models_to_sync.role | bool
        fail_msg: Bootstrap model defaults differ from their documented selection.

    - name: Assert settings include the UI host and apps but omit opt-in Bootstrap settings
      ansible.builtin.assert:
        that:
          - "server_ui_fqdn in server_rendered_config"
          - "'nautobot_ssot' in server_rendered_config"
          - "'nautobot_device_onboarding' in server_rendered_config"
          - "server_db_host in server_rendered_config"
          - >-
            ('"hide_example_jobs": True,') in server_rendered_config
          - "'enable_bootstrap' not in server_rendered_config"
          - "'bootstrap_nautobot_environment_branch' not in server_rendered_config"
          - "'bootstrap_models_to_sync' not in server_rendered_config"
        fail_msg: Rendered settings do not honor the default-off Bootstrap configuration.
      vars:
        server_rendered_config: "{{ server_config.content | b64decode }}"

    - name: Exercise the Bootstrap dependency guard against each DLM configuration
      ansible.builtin.include_tasks:
        file: tasks/bootstrap_guard_case.yml
      loop: "{{ server_bootstrap_guard_cases }}"
      loop_control:
        loop_var: server_bootstrap_guard_case
        label: "{{ server_bootstrap_guard_case.name }}"

    - name: Stat the Nautobot environment file
      ansible.builtin.stat:
        path: "{{ server_root }}/nautobot.env"
      register: server_env_stat

    - name: Read the Nautobot environment file
      ansible.builtin.slurp:
        src: "{{ server_root }}/nautobot.env"
      register: server_env_file

    - name: Assert the environment file is private and omits credentials outside its scope
      ansible.builtin.assert:
        that:
          - server_env_stat.stat.exists
          - server_env_stat.stat.mode == '0600'
          - server_superuser_password not in server_env_text
          - "'molecule-export-credential' not in server_env_text"
          - "'AWS_ACCESS_KEY_ID' not in server_env_text"
          - "'AWS_SECRET_ACCESS_KEY' not in server_env_text"
        fail_msg: nautobot.env is missing, has an unsafe mode, or contains an unrelated credential.
      vars:
        server_env_text: "{{ server_env_file.content | b64decode }}"

    - name: Assert every environment entry is a double-quoted assignment that keeps the original text
      ansible.builtin.assert:
        that:
          - >-
            server_env_text.splitlines() | reject('match', '^#') | reject('match', '^$')
            | reject('match', '^[A-Za-z_][A-Za-z0-9_]*=".*"$') | list | length == 0
          - >-
            ('NAUTOBOT_DB_PASSWORD="molecule-db-\\"quoted\\"\\\\placeholder"')
            in server_env_text.splitlines()
        fail_msg: nautobot.env does not quote its values or does not escape a double quote and a backslash.
      vars:
        server_env_text: "{{ server_env_file.content | b64decode }}"
      no_log: true

    - name: Assert the settings enable secure cookies when TLS ends at the proxy
      ansible.builtin.assert:
        that:
          - "'SESSION_COOKIE_SECURE = True' in server_rendered_config.splitlines()"
          - "'CSRF_COOKIE_SECURE = True' in server_rendered_config.splitlines()"
        fail_msg: Secure cookie flags are missing although the proxy header is trusted.

    - name: Read the rendered uWSGI configuration
      ansible.builtin.slurp:
        src: "{{ server_root }}/uwsgi.ini"
      register: server_uwsgi_file

    - name: Assert the web service listens on loopback by default
      ansible.builtin.assert:
        that:
          - "'http = 127.0.0.1:' ~ server_role_defaults.server_web_port in server_uwsgi_lines"
          - server_role_defaults.server_web_bind == '127.0.0.1'
          - server_role_specs.argument_specs.main.options.server_web_bind.default == '127.0.0.1'
        fail_msg: The web service does not listen on loopback by default.
      vars:
        server_uwsgi_lines: "{{ (server_uwsgi_file.content | b64decode).splitlines() }}"

    - name: Assert SECRET_KEY exists and is stable after the second converge
      ansible.builtin.slurp:
        src: "{{ server_root }}/.secret_key"
      register: server_final_secret_key
      no_log: true

    - name: Read the test-only SECRET_KEY fingerprint
      ansible.builtin.slurp:
        src: /tmp/server-secret-key.sha256
      register: server_secret_key_fingerprint
      no_log: true

    - name: Confirm SECRET_KEY persistence and stability
      ansible.builtin.assert:
        that:
          - server_final_secret_key.content | b64decode | length > 0
          - >-
            (server_final_secret_key.content | b64decode | hash('sha256'))
            == (server_secret_key_fingerprint.content | b64decode | trim)
        fail_msg: SECRET_KEY was not persisted once and kept stable.
      no_log: true

    - name: Stat the three Nautobot systemd units
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}"
      loop:
        - nautobot-server.service
        - nautobot-worker.service
        - nautobot-scheduler.service
      register: server_units

    - name: Assert all three Nautobot systemd units exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Nautobot systemd unit {{ item.item }} is missing."
      loop: "{{ server_units.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read Redis configuration
      ansible.builtin.slurp:
        src: /etc/redis/redis.conf
      register: server_redis_conf

    - name: Assert Redis is bound to loopback
      ansible.builtin.assert:
        that:
          - "'bind localhost' in (server_redis_conf.content | b64decode)"
        fail_msg: Redis is not bound to loopback.

    - name: Inspect role files for standalone scripts
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../../../roles/server"
        recurse: true
        patterns:
          - "*.py"
          - "*.sh"
          - "*.rb"
      register: server_script_files
      delegate_to: localhost
      become: false

    - name: Inspect role directories for a files directory
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../../../roles/server"
        recurse: true
        file_type: directory
        patterns: files
      register: server_files_directories
      delegate_to: localhost
      become: false

    - name: Assert the role contains no standalone scripts or files directory
      ansible.builtin.assert:
        that:
          - server_script_files.matched == 0
          - server_files_directories.matched == 0
        fail_msg: The server role contains a standalone script or files directory.
      delegate_to: localhost
      become: false

    - name: Search role tasks for file lookup script input
      ansible.builtin.command:
        argv:
          - grep
          - -rFn
          - "lookup('ansible.builtin.file'"
          - "{{ playbook_dir }}/../../../../roles/server/tasks"
      register: server_file_lookup_search
      changed_when: false
      failed_when: server_file_lookup_search.rc not in [0, 1]
      delegate_to: localhost
      become: false

    - name: Assert server tasks do not read scripts through file lookups
      ansible.builtin.assert:
        that:
          - server_file_lookup_search.rc == 1
        fail_msg: A server task still reads a file lookup script.
      delegate_to: localhost
      become: false

    # The remaining tasks replace the play's variables with the role defaults so the templates render with
    # chosen overrides; keep them last.
    - name: Load every role default so the templates can be rendered with chosen overrides
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../roles/server/defaults/main.yml"

    - name: Choose a caller bind address and distrust the proxy header
      ansible.builtin.set_fact:
        server_web_bind: 192.0.2.10
        server_trust_proxy_ssl_header: false

    - name: Render the uWSGI configuration with the caller bind address
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../../../roles/server/templates/uwsgi.ini.j2"
        dest: /tmp/uwsgi-caller-bind.ini
        mode: "0600"

    - name: Render the settings with the proxy header distrusted
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../../../roles/server/templates/nautobot_config.py.j2"
        dest: /tmp/nautobot_config-untrusted.py
        mode: "0600"

    - name: Read the two override renders
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /tmp/uwsgi-caller-bind.ini
        - /tmp/nautobot_config-untrusted.py
      register: server_override_renders

    - name: Assert the caller bind is used and no secure cookie flag is set without the proxy header
      ansible.builtin.assert:
        that:
          - "'http = 192.0.2.10:' ~ server_web_port in server_bind_lines"
          - "'SESSION_COOKIE_SECURE' not in server_untrusted_text"
          - "'CSRF_COOKIE_SECURE' not in server_untrusted_text"
          - "'SECURE_PROXY_SSL_HEADER' not in server_untrusted_text"
        fail_msg: The caller bind or the proxy-header cookie rule is not honoured.
      vars:
        server_bind_lines: "{{ (server_override_renders.results[0].content | b64decode).splitlines() }}"
        server_untrusted_text: "{{ server_override_renders.results[1].content | b64decode }}"

    - name: Enable Bootstrap with its DLM dependencies for the settings render
      ansible.builtin.set_fact:
        server_bootstrap_enabled: true
        server_plugins: "{{ server_plugins + ['nautobot_device_lifecycle_mgmt'] }}"
        server_pip_packages: "{{ server_pip_packages + ['nautobot-device-lifecycle-mgmt[extra]==1.0'] }}"

    - name: Render the settings with Bootstrap enabled
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../../../roles/server/templates/nautobot_config.py.j2"
        dest: /tmp/nautobot_config-bootstrap-enabled.py
        mode: "0600"

    - name: Read the Bootstrap-enabled settings
      ansible.builtin.slurp:
        src: /tmp/nautobot_config-bootstrap-enabled.py
      register: server_bootstrap_enabled_config_file

    - name: Decode the Bootstrap-enabled settings
      ansible.builtin.set_fact:
        server_bootstrap_enabled_config: "{{ server_bootstrap_enabled_config_file.content | b64decode }}"

    - name: Parse Bootstrap-enabled settings as Python
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - import ast,sys; ast.parse(open(sys.argv[1]).read())
          - /tmp/nautobot_config-bootstrap-enabled.py
      changed_when: false

    - name: Assert Bootstrap settings and model selection render when enabled
      ansible.builtin.assert:
        that:
          - >-
            ('"enable_bootstrap": True,') in server_bootstrap_enabled_config
          - >-
            'bootstrap_nautobot_environment_branch' in server_bootstrap_enabled_config
          - >-
            'bootstrap_models_to_sync' in server_bootstrap_enabled_config
          - >-
            'nautobot_device_lifecycle_mgmt' in server_bootstrap_enabled_config
        fail_msg: Rendered settings omit enabled Bootstrap configuration or its DLM plugin.

    - name: Assert the enabled Bootstrap model selection renders as Python literals
      ansible.builtin.assert:
        that:
          - >-
            ('"' ~ item.key ~ '": ' ~ ('True' if item.value else 'False') ~ ',')
            in server_bootstrap_enabled_config
          - server_bootstrap_enabled_config is not search(':\s+(true|false)\b')
        fail_msg: Rendered Bootstrap model selection is not valid Python.
      loop: "{{ server_bootstrap_expected_models | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

- name: Verify the stage tags select disjoint task sets
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    server_stage_prefix: "server : "
    server_stage_cases:
      - name: install
        skip: server_secret,server_migrate,server_config
        present:
          - Install system packages, create the service account, and configure Redis
          - Create the Nautobot virtual environment
          - Install pinned Nautobot applications
        absent:
          - Resolve and persist the Nautobot SECRET_KEY
          - Render the Nautobot settings
          - Run Nautobot database migrations
          - Enable and start Nautobot services
      - name: migrate
        skip: server_install,server_config
        present:
          - Resolve and persist the Nautobot SECRET_KEY
          - Render the private Nautobot command environment
          - Run Nautobot database migrations
          - Render the private Nautobot superuser command environment
          - Run Nautobot createsuperuser
        absent:
          - Create the Nautobot virtual environment
          - Render the Nautobot settings
          - Enable and start Nautobot services
      - name: config
        skip: server_install,server_migrate
        present:
          - Resolve and persist the Nautobot SECRET_KEY
          - Render the Nautobot settings
          - Install Nautobot systemd units
          - Record the package pins the services run and restart them when the pins changed
          - Apply pending Nautobot service handlers
          - Enable and start Nautobot services
          - Wait for the Nautobot web interface to answer
        absent:
          - Install pinned Nautobot applications
          - Run Nautobot database migrations
      - name: full
        skip: server_unused_tag
        present:
          - Install pinned Nautobot applications
          - Resolve and persist the Nautobot SECRET_KEY
          - Run Nautobot database migrations
          - Render the Nautobot settings
          - Record the package pins the services run and restart them when the pins changed
          - Enable and start Nautobot services
        absent: []
  tasks:
    - name: List the role tasks for each stage
      ansible.builtin.command:
        cmd: "ansible-playbook -i localhost, --list-tasks --skip-tags {{ item.skip }} {{ playbook_dir }}/stage_tags.yml"
      environment:
        ANSIBLE_ROLES_PATH: "{{ playbook_dir }}/../../../../roles"
      loop: "{{ server_stage_cases }}"
      loop_control:
        label: "{{ item.name }}"
      register: server_stage_lists
      changed_when: false

    - name: Assert each stage lists exactly its own tasks
      ansible.builtin.assert:
        that:
          - server_stage_present | select('in', item.1.stdout) | list | length == server_stage_present | length
          - server_stage_absent | select('in', item.1.stdout) | list | length == 0
        fail_msg: "Stage {{ item.0.name }} does not select the expected server role tasks."
      vars:
        server_stage_present: "{{ item.0.present | map('regex_replace', '^', server_stage_prefix) | list }}"
        server_stage_absent: "{{ item.0.absent | map('regex_replace', '^', server_stage_prefix) | list }}"
      loop: "{{ server_stage_cases | zip(server_stage_lists.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"

    - name: Assert the three validation tasks carry no stage tag
      ansible.builtin.assert:
        that:
          - server_untagged | length == 3
          - >-
            server_untagged
            | select('search', 'Require DLM when the SSoT Bootstrap integration is enabled')
            | list | length == 1
          - server_untagged | select('search', 'Validate OpenBao and superuser inputs') | list | length == 1
          - server_untagged | select('search', 'Validate the database credential') | list | length == 1
        fail_msg: "Stage {{ item.item.name }} lists a server role task that has no stage tag."
      vars:
        server_untagged: "{{ item.stdout_lines | select('search', '^ +server : .*TAGS: \\[\\]$') | list }}"
      loop: "{{ server_stage_lists.results }}"
      loop_control:
        label: "{{ item.item.name }}"
