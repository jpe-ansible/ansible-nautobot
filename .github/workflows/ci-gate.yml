---
name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github/.github/workflows/_ansible-ci.yml@v1
    with:
      molecule: false
      molecule_scenario_filters: &molecule_scenario_filters |
        server:
          - 'roles/server/**'
          - 'roles/url_guard/**'
          - 'molecule/server/**'
        sync_in:
          - 'roles/sync_in/**'
          - 'roles/url_guard/**'
          - 'molecule/sync_in/**'
          - 'global_settings.yml'
          - 'develop.yml'
        sync_out:
          - 'roles/sync_out/**'
          - 'roles/url_guard/**'
          - 'molecule/sync_out/**'
        drift:
          - 'roles/drift/**'
          - 'roles/url_guard/**'
          - 'molecule/drift/**'
        preflight:
          - 'roles/preflight/**'
          - 'roles/url_guard/**'
          - 'molecule/preflight/**'
        url_guard:
          - 'roles/url_guard/**'
          - 'molecule/url_guard/**'
          - 'requirements*'
        live:
          - 'roles/server/defaults/**'
          - 'roles/sync_in/**'
          - 'roles/sync_out/**'
          - 'roles/preflight/**'
          - 'roles/drift/**'
          - 'roles/url_guard/**'
          - 'global_settings.yml'
          - 'molecule/live/**'
          - 'requirements*'

  changes:
    name: Detect Changes
    uses: JacobPEvans/.github/.github/workflows/_ansible-changes.yml@v1
    with:
      molecule: false
      molecule_scenario_filters: *molecule_scenario_filters

  molecule:
    name: Molecule
    needs: changes
    if: ${{ needs.changes.outputs.molecule == 'true' && needs.changes.outputs.molecule_scenarios != '[]' }}
    uses: JacobPEvans/.github/.github/workflows/_molecule.yml@v1
    with:
      # An empty output means the full suite (a promotion to main); every scenario then runs.
      scenarios: >-
        ${{ needs.changes.outputs.molecule_scenarios
        || '["server", "sync_in", "sync_out", "preflight", "drift", "url_guard", "live"]' }}
      scenario_discovery: caller_supplied
      runner_label: ubuntu-latest
      pull_request_timeout_minutes: 32
      timeout_minutes: 360
      python_version: "3.14"
      python_install_mode: pip_requirements
      requirements_files: '["requirements-test.txt", "requirements.txt"]'
      ansible_home_mode: shared
      galaxy_cache_enabled: false
      galaxy_install_mode: collections_only
      galaxy_retry_attempts: 1
      galaxy_step_timeout_minutes: 360
      galaxy_server_timeout_seconds: 0
      fail_fast: false
      docker_timeout_seconds: 0
      docker_prune: false
      molecule_workdir_mode: scenario_directory
      molecule_scenario_arg: default
      molecule_args: ""
      doppler_enabled: false
      test_secret_env_map: "{}"
      use_homarr_token: false

  gate:
    name: Merge Gate
    needs: [ci, changes, molecule]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: molecule
          jobs: ${{ toJSON(needs) }}
