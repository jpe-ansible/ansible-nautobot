---
name: Molecule

on:
  workflow_call:
    inputs:
      scenarios:
        description: JSON array of the scenarios to run
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Molecule (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenarios) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install Molecule and controller requirements
        run: python -m pip install -r requirements-test.txt -r requirements.txt

      - name: Install the pinned collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule scenario
        working-directory: molecule/${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
        run: molecule test -s default
